spring:
  application:
    name: barbearia-manager
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/barbearia?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Campo_Grande}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: America/Campo_Grande
  flyway:
    enabled: true
  jackson:
    time-zone: America/Campo_Grande
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
app:
  # Obrigatório: mínimo de 32 caracteres. Não há valor padrão por segurança.
  jwt-secret: ${APP_JWT_SECRET:}
  jwt-expiracao-horas: 8
  cors-origens: ${APP_CORS_ORIGINS:http://localhost:5173}
  # Administrador inicial: criado somente se não existir nenhum administrador E as duas variáveis estiverem definidas.
  admin-inicial-email: ${APP_ADMIN_EMAIL:}
  admin-inicial-senha: ${APP_ADMIN_PASSWORD:}
  timezone: ${APP_TIMEZONE:America/Campo_Grande}
  cancelamento-antecedencia-horas: 2
  lembrete-antecedencia-horas: 24
  intervalo-slot-minutos: 30
